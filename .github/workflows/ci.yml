name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 5" # Friday 12:00 UTC, after the weekly vote
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: for f in sh/*.sh test/sh/*.sh; do sh -n "$f"; done
      - run: shellcheck -s sh -x sh/*.sh test/sh/*.sh
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  prettier:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npx prettier --check .

  golden:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: test/sh/golden.sh

  # Weekly drift check against the key project. Reads only; no stored secret.
  check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq openssl
      - env:
          KEY_PROJECT: ${{ vars.KEY_PROJECT }}
          KEEPER_PROJECT: ${{ vars.KEEPER_PROJECT }}
          LOCATION: ${{ vars.LOCATION }}
          KEY_RING: ${{ vars.KEY_RING }}
          KEY: ${{ vars.KEY }}
          ADMIN_MEMBER: ${{ vars.ADMIN_MEMBER }}
          KEEPER_SA: ${{ vars.KEEPER_SA }}
        run: |
          cat >config.env <<CFG
          KEY_PROJECT='$KEY_PROJECT'
          KEEPER_PROJECT='$KEEPER_PROJECT'
          LOCATION='$LOCATION'
          KEY_RING='$KEY_RING'
          KEY='$KEY'
          ADMIN_MEMBER='$ADMIN_MEMBER'
          KEEPER_SA='$KEEPER_SA'
          CFG
      - run: sh/check.sh
